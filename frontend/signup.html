<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup</title>

<style>

/* =========================
   BODY
========================= */

body {
    margin: 0;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;

    background: linear-gradient(
        -45deg,
        #ff7eb3,
        #6a11cb,
        #2575fc,
        #00c6ff
    );

    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================
   BACKGROUND ANIMATION
========================= */

@keyframes gradientBG {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}


/* =========================
   NAVBAR
========================= */

.navbar {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 80px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 50px;

    box-sizing: border-box;

    background: rgba(35, 35, 90, 0.95);

    z-index: 1000;
}


/* =========================
   LOGO
========================= */

.logo {

    color: white;

    font-size: 25px;

    font-weight: 800;

    font-family: "Poppins", sans-serif;
}


/* =========================
   NAVIGATION
========================= */

.nav-links {

    display: flex;

    gap: 12px;

    align-items: center;
}


/* =========================
   NAVIGATION BOXES
========================= */

.nav-links a {

    color: white;

    text-decoration: none;

    padding: 12px 22px;

    min-width: 80px;

    text-align: center;

    border: 1px solid rgba(255, 255, 255, 0.3);

    border-radius: 8px;

    background: rgba(255, 255, 255, 0.08);

    transition: all 0.3s ease;
}


/* =========================
   ACTIVE PAGE
========================= */

.nav-links a.active {

    background: #2db5d3;

    color: white;

    border-color: #95d7e6;
}


/* =========================
   NAVIGATION HOVER
========================= */

.nav-links a:hover {

    background: #2db5d3;

    color: white;

    transform: translateY(-2px);
}


/* =========================
   SIGNUP CARD
========================= */

.form-container {

    background: rgba(255, 255, 255, 0.15);

    padding: 30px;

    border-radius: 20px;

    backdrop-filter: blur(15px);

    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);

    width: 390px;

    box-sizing: border-box;

    text-align: center;

    color: white;

    margin-top: 80px;
}


/* =========================
   TITLE
========================= */

.form-container h2 {

    margin: 0 0 25px 0;

    font-size: 30px;

    color: white;
}


/* =========================
   FORM GROUP
========================= */

.form-group {

    text-align: left;

    margin-bottom: 20px;

    width: 100%;
}


/* =========================
   LABEL
========================= */

.form-group label {

    display: block;

    color: white;

    font-size: 14px;

    font-weight: 600;

    margin-bottom: 7px;

    padding-left: 2px;
}


/* =========================
   INPUT WRAPPER
========================= */

.input-wrapper {

    position: relative;

    width: 100%;
}


/* =========================
   INPUT
========================= */

.form-group input {

    width: 100%;

    height: 46px;

    padding: 0 45px 0 12px;

    box-sizing: border-box;

    border: none;

    border-radius: 10px;

    outline: none;

    background: white;

    color: #333;

    font-size: 16px;

    transition: 0.3s;
}


/* =========================
   PLACEHOLDER
========================= */

.form-group input::placeholder {

    color: #888;

    opacity: 1;
}


/* =========================
   INPUT FOCUS
========================= */

.form-group input:focus {

    outline: 2px solid rgba(255, 255, 255, 0.5);

    background: #ffffff;
}


/* =========================
   PASSWORD TOGGLE
========================= */

.toggle {

    position: absolute;

    right: 13px;

    top: 50%;

    transform: translateY(-50%);

    cursor: pointer;

    font-size: 18px;

    user-select: none;
}


/* =========================
   SIGNUP BUTTON
========================= */

button {

    width: 100%;

    height: 48px;

    padding: 10px;

    border: none;

    border-radius: 10px;

    background: #00c6ff;

    color: white;

    font-size: 17px;

    font-weight: 600;

    cursor: pointer;

    transition: 0.3s;

    margin-top: 3px;
}


/* =========================
   BUTTON HOVER
========================= */

button:hover {

    background: #0072ff;

    transform: translateY(-2px);

    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}


/* =========================
   LOGIN LINK
========================= */

.form-container p {

    margin-top: 18px;

    font-size: 14px;

    color: white;
}


.form-container p a {

    color: white;

    font-weight: 600;

    text-decoration: underline;
}


.form-container p a:hover {

    color: #00c6ff;
}


/* =========================
   RESPONSIVE NAVBAR
========================= */

@media (max-width: 800px) {

    .navbar {

        padding: 0 20px;
    }

    .logo {

        font-size: 20px;
    }

    .nav-links {

        gap: 5px;
    }

    .nav-links a {

        min-width: auto;

        padding: 10px 12px;

        font-size: 14px;
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .navbar {

        height: auto;

        min-height: 70px;

        padding: 10px 15px;

        flex-direction: column;

        gap: 10px;
    }

    .nav-links {

        flex-wrap: wrap;

        justify-content: center;
    }

    .form-container {

        width: 90%;

        max-width: 390px;

        margin-top: 110px;

        padding: 25px;
    }

}


/* =========================
   SMALL MOBILE
========================= */

@media (max-width: 400px) {

    .form-container {

        width: 92%;

        padding: 22px;
    }

    .form-container h2 {

        font-size: 26px;
    }

}

</style>
</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

    <div class="logo">
        Daily Verse Blog
    </div>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="create.html">
            Write
        </a>

        <a href="blogs.html">
            Blog Store
        </a>

        <a href="signup.html" class="active">
            Sign Up
        </a>

        <a href="login.html">
            Login
        </a>

    </div>

</nav>


<!-- =========================
     SIGNUP FORM
========================= -->

<div class="form-container">

    <h2>🚀 Signup</h2>

    <form onsubmit="signup(event)">


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <div class="input-wrapper">

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="input-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <span
                    class="toggle"
                    onclick="togglePassword('password')"
                >
                    👁
                </span>

            </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <div class="input-wrapper">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

                <span
                    class="toggle"
                    onclick="togglePassword('confirmPassword')"
                >
                    👁
                </span>

            </div>

        </div>


        <!-- SIGNUP BUTTON -->

        <button type="submit">
            Signup
        </button>


        <!-- LOGIN LINK -->

        <p>
            Already have an account?
            <a href="login.html">
                Login
            </a>
        </p>

    </form>

</div>


<script>

const API = "http://localhost:5000";


// =========================
// PASSWORD TOGGLE
// =========================

function togglePassword(id) {

    const field = document.getElementById(id);

    field.type =
        field.type === "password"
            ? "text"
            : "password";
}


// =========================
// SIGNUP FUNCTION
// =========================

async function signup(e) {

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value.trim();

    const confirm =
        document.getElementById("confirmPassword").value.trim();


    // CHECK PASSWORDS

    if (password !== confirm) {

        alert("Passwords do not match ❌");

        return;
    }


    try {

        const res = await fetch(
            `${API}/api/auth/signup`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email,
                    password
                })
            }
        );


        const data = await res.json();

        console.log(
            "Signup response:",
            data
        );


        // SUCCESS

        if (res.ok) {

            alert(
                "Signup successful ✅"
            );

            window.location.href =
                "login.html";

        }

        // ERROR

        else {

            alert(
                data.message ||
                "Signup failed ❌"
            );

        }

    }

    catch (err) {

        console.error(err);

        alert(
            "Server error ❌"
        );

    }

}

</script>


</body>
</html>
